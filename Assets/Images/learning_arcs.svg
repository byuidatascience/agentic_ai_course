  <circle cx="1198" cy="860" r="3" fill="#163A8C"/>
  <line x1="1198" y1="860" x2="1214" y2="844" stroke="#163A8C" stroke-width="3" stroke-linecap="round"/>
  <text x="1236" y="853" font-size="17" font-weight="700" fill="#0E1F4D">Inside Unit 3,</text>
  <text x="1236" y="875" font-size="17" font-weight="700" fill="#0E1F4D">you’ll learn</text>
  <rect x="1220" y="883" width="217" height="34" rx="17" fill="#D3EFDA"/>
  <text x="1328" y="907" font-size="18" font-weight="700" fill="#0E1F4D" text-anchor="middle">Context Engineering</text>
  <g font-size="15" fill="#2A3550">
    <text x="1240" y="940">— turning fuzzy business needs</text>
    <text x="1252" y="964">into architectural decisions</text>
    <text x="1252" y="988">with metrics and safety standards.</text>
  </g>
