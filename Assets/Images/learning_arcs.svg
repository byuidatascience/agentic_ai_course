    <rect x="724" y="556" width="50" height="40" rx="10" fill="#fff" stroke="#1F2A44" stroke-width="3"/>
    <circle cx="741" cy="576" r="4" fill="#1F2A44"/><circle cx="757" cy="576" r="4" fill="#1F2A44"/>
    <line x1="749" y1="548" x2="749" y2="556" stroke="#1F2A44" stroke-width="3"/>
    <rect x="722" y="608" width="70" height="5" rx="2" fill="#7A8AA8"/>
    <rect x="722" y="620" width="56" height="5" rx="2" fill="#AEB9CC"/>
    <path d="M822,556 L846,596 L798,596 Z" fill="#E53935"/>
    <rect x="820" y="568" width="4" height="15" fill="#fff"/><circle cx="822" cy="589" r="2.5" fill="#fff"/>
    <rect x="800" y="608" width="60" height="5" rx="2" fill="#AEB9CC"/>
    <!-- checklist card -->
    <rect x="828" y="606" width="140" height="106" rx="10" fill="#fff"/>
    <g font-size="14" fill="#1F2A44">
      <g fill="none" stroke="#1F2A44" stroke-width="2"><rect x="842" y="615" width="13" height="13" rx="2"/><rect x="842" y="638" width="13" height="13" rx="2"/><rect x="842" y="661" width="13" height="13" rx="2"/><rect x="842" y="684" width="13" height="13" rx="2"/></g>
      <g fill="none" stroke="#1F2A44" stroke-width="2" stroke-linecap="round"><path d="M845,621 l3,3 l5,-6"/><path d="M845,644 l3,3 l5,-6"/><path d="M845,667 l3,3 l5,-6"/><path d="M845,690 l3,3 l5,-6"/></g>
      <text x="872" y="627">Logs</text><text x="872" y="650">Errors</text><text x="872" y="673">Behavior</text><text x="872" y="696">Performance</text>
    </g>
    <!-- person -->
    <path d="M590,720 C590,650 615,612 655,608 C700,608 722,640 728,720 Z" fill="#22335E"/>
    <path d="M640,612 L656,660 L672,612 Z" fill="#F4F6FA"/>
    <rect x="644" y="585" width="24" height="28" fill="#E3A47D"/>
    <path d="M612,560 C600,505 640,485 668,492 C700,498 712,530 704,570 C700,600 690,620 686,640 L630,640 C620,615 615,590 612,560 Z" fill="#1A2238"/>
