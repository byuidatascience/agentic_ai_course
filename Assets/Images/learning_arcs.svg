    <!-- rocket -->
    <g transform="translate(1450,540) rotate(35)">
      <path d="M0,-40 C14,-26 16,0 12,18 L-12,18 C-16,0 -14,-26 0,-40 Z" fill="#1E8A4C"/>
      <circle cx="0" cy="-12" r="6" fill="#fff"/>
