<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" width="1536" height="1024" font-family="'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="headBlue" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1565D8"/></marker>
    <marker id="headGreen" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E8A4C"/></marker>
    <marker id="headGray" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9AA6B8"/></marker>
    <marker id="headSmall" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E8A4C"/></marker>
  </defs>

  <!-- Background -->
  <rect width="1536" height="1024" fill="#F8FAFC"/>

  <!-- ===== Header ===== -->
  <g transform="translate(352,24)">
    <path d="M0,62 L36,10 L48,26 L56,16 L74,62 Z" fill="#163A8C"/>
    <path d="M36,10 L44,22 L36,30 L30,22 Z" fill="#2F6BE0"/>
    <line x1="48" y1="26" x2="48" y2="2" stroke="#163A8C" stroke-width="3"/>
    <path d="M48,2 L64,7 L48,12 Z" fill="#F5B416"/>
  </g>
  <text x="450" y="80" font-size="64" font-weight="800" fill="#0E1F4D" letter-spacing="-1">Learning Arcs</text>
  <line x1="897" y1="30" x2="897" y2="88" stroke="#C5CEDB" stroke-width="2"/>
  <text x="942" y="82" font-size="58" fill="#24324F">The Story</text>
  <text x="768" y="131" font-size="25" fill="#3A4660" text-anchor="middle">Three units. One journey — from building, to diagnosing, to designing truly great agents.</text>

  <!-- ===== Panels ===== -->
  <rect x="18" y="156" width="484" height="666" rx="18" fill="#E7F1FD"/>
  <rect x="523" y="156" width="489" height="666" rx="18" fill="#FEF6E0"/>
  <rect x="1033" y="156" width="484" height="666" rx="18" fill="#E5F5E9"/>

  <!-- Flow arrows -->
  <path d="M450,282 C480,240 515,232 555,246" fill="none" stroke="#1565D8" stroke-width="9" stroke-linecap="round" marker-end="url(#headBlue)"/>
  <path d="M966,282 C996,240 1031,232 1071,246" fill="none" stroke="#1E8A4C" stroke-width="9" stroke-linecap="round" marker-end="url(#headGreen)"/>

  <!-- ===== Unit 1 ===== -->
  <circle cx="208" cy="209" r="33" fill="#1565D8"/>
  <text x="208" y="223" font-size="38" font-weight="800" fill="#fff" text-anchor="middle">1</text>
  <text x="256" y="219" font-size="29" font-weight="700" fill="#1565D8">Unit 1</text>
  <text x="262" y="295" font-size="58" font-weight="800" fill="#0E1F4D" text-anchor="middle">Build</text>
  <g font-size="22" fill="#1F2A44">
    <text x="70" y="334">This is your chance to build the</text>
    <text x="70" y="366">powerful agent of your dreams.</text>
    <text x="70" y="398">We are arming you right from the start</text>
    <text x="70" y="430">with the coolest tools possible, and you</text>
    <text x="70" y="462">can make your own personalized</text>
    <text x="70" y="494">assistant.</text>
  </g>

  <!-- Illustration 1: builder at laptop -->
  <g>
    <path d="M60,720 C40,640 90,560 180,570 C240,520 330,540 380,590 C440,600 460,680 430,720 Z" fill="#D2E5FA"/>
    <!-- body / hoodie -->
    <path d="M95,720 C95,640 130,605 185,600 C235,600 265,630 270,720 Z" fill="#1E4FA8"/>
    <path d="M160,603 C170,625 200,625 210,603" fill="none" stroke="#163C82" stroke-width="5"/>
