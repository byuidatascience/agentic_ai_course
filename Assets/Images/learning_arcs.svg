    </g>
  </g>
  <rect x="90" y="733" width="342" height="70" rx="35" fill="#1565D8"/>
  <text x="262" y="783" font-size="44" font-weight="800" fill="#fff" text-anchor="middle">Build</text>
  <g stroke="#fff" stroke-width="3" stroke-linecap="round">
    <line x1="160" y1="760" x2="176" y2="760"/><line x1="164" y1="749" x2="174" y2="755"/><line x1="164" y1="771" x2="174" y2="765"/>
    <line x1="348" y1="760" x2="364" y2="760"/><line x1="350" y1="755" x2="360" y2="749"/><line x1="350" y1="765" x2="360" y2="771"/>
  </g>

  <!-- ===== Unit 2 ===== -->
  <circle cx="705" cy="211" r="33" fill="#F5B416"/>
  <text x="705" y="225" font-size="38" font-weight="800" fill="#fff" text-anchor="middle">2</text>
  <text x="754" y="221" font-size="29" font-weight="700" fill="#E3A008">Unit 2</text>
  <text x="773" y="295" font-size="58" font-weight="800" fill="#0E1F4D" text-anchor="middle">Diagnose</text>
  <g font-size="22" fill="#1F2A44">
    <text x="575" y="334">You have been hired at ACME.io,</text>
    <text x="575" y="364">the one stop shop for everything tech</text>
    <text x="575" y="394">related. They hired you to diagnose</text>
    <text x="575" y="424">and fix an agent they have already made.</text>
    <text x="575" y="454">You’re going to excel in your new role</text>
    <text x="575" y="484">and report everything you find.</text>
    <text x="575" y="514">Even if it scares you…</text>
  </g>

  <!-- Illustration 2: diagnostician -->
  <g transform="translate(115.5,124) scale(0.85)">
    <path d="M560,720 C545,640 600,570 690,575 C760,530 880,535 930,580 C970,620 960,690 940,720 Z" fill="#FCE9B4"/>
