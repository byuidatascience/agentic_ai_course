      </g>
      <text x="1315" y="561">User Needs</text>
      <text x="1285" y="607">Architecture</text>
      <text x="1377" y="607">Safety</text>
      <text x="1288" y="652">Metrics</text>
      <text x="1377" y="652">Reliability</text>
    </g>
    <g fill="none" stroke="#1E8A4C" stroke-width="2" marker-end="url(#headSmall)">
      <path d="M1295,569 L1295,580 L1285,580 L1285,588"/>
      <path d="M1340,569 L1340,580 L1377,580 L1377,588"/>
      <path d="M1287,616 L1287,633"/>
      <path d="M1377,616 L1377,633"/>
      <path d="M1288,661 L1288,684 L1310,684"/>
      <path d="M1377,661 L1377,684 L1352,684"/>
    </g>
