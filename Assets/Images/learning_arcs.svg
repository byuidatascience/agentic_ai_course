    <!-- floating tiles -->
    <rect x="285" y="500" width="66" height="66" rx="12" fill="#2F7CF0"/>
    <rect x="300" y="520" width="36" height="28" rx="9" fill="#fff"/>
    <circle cx="311" cy="534" r="4" fill="#1A2238"/><circle cx="325" cy="534" r="4" fill="#1A2238"/>
    <line x1="318" y1="512" x2="318" y2="520" stroke="#fff" stroke-width="3"/><circle cx="318" cy="510" r="3" fill="#fff"/>
