    </g>
    <g stroke="#1F2A44" stroke-width="3" stroke-linecap="round"><line x1="1396" y1="545" x2="1408" y2="552"/><line x1="1098" y1="608" x2="1110" y2="615"/></g>
    <!-- person (facing right) -->
