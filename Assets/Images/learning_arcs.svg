    <path d="M700,720 L730,656 L812,656 L788,720 Z" fill="#5B6680"/>
    <circle cx="766" cy="688" r="4" fill="#3E4860"/>
    <rect x="684" y="716" width="122" height="8" rx="3" fill="#3E4860"/>
    <g stroke="#F5B416" stroke-width="3" stroke-linecap="round"><line x1="900" y1="580" x2="912" y2="566"/><line x1="910" y1="592" x2="926" y2="588"/></g>
  </g>
  <rect x="584" y="733" width="364" height="70" rx="35" fill="#F5B416"/>
  <text x="770" y="783" font-size="44" font-weight="800" fill="#fff" text-anchor="middle">Diagnose</text>
  <g stroke="#fff" stroke-width="3" stroke-linecap="round">
    <line x1="638" y1="760" x2="654" y2="760"/><line x1="642" y1="749" x2="652" y2="755"/><line x1="642" y1="771" x2="652" y2="765"/>
    <line x1="886" y1="760" x2="902" y2="760"/><line x1="888" y1="755" x2="898" y2="749"/><line x1="888" y1="765" x2="898" y2="771"/>
  </g>

  <!-- ===== Unit 3 ===== -->
  <circle cx="1222" cy="211" r="33" fill="#1E8A4C"/>
  <text x="1222" y="225" font-size="38" font-weight="800" fill="#fff" text-anchor="middle">3</text>
  <text x="1270" y="221" font-size="29" font-weight="700" fill="#1E8A4C">Unit 3</text>
  <text x="1280" y="295" font-size="58" font-weight="800" fill="#0E1F4D" text-anchor="middle">Design</text>
  <g font-size="22" fill="#1F2A44">
    <text x="1087" y="336">Armed with what you know about</text>
    <text x="1087" y="368">safety and architecture, it is time to plan</text>
    <text x="1087" y="400">your new startup’s agents from the ground</text>
    <text x="1087" y="432">up with reliability and safety in mind.</text>
    <text x="1087" y="464">Blow the competition away with</text>
    <text x="1087" y="496">something that really works.</text>
  </g>

  <!-- Illustration 3: designer at whiteboard -->
  <g>
    <path d="M1075,720 C1060,640 1110,560 1200,565 C1280,520 1420,520 1470,580 C1500,630 1490,690 1470,720 Z" fill="#CDEBD5"/>
