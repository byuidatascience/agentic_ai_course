    <path d="M205,568 C212,575 222,573 226,566" fill="none" stroke="#9A4A2E" stroke-width="3" stroke-linecap="round"/>
    <!-- laptop -->
    <path d="M255,720 L292,636 L388,636 L360,720 Z" fill="#5B6680"/>
    <path d="M325,668 l4,10 l10,4 l-10,4 l-4,10 l-4,-10 l-10,-4 l10,-4 z" fill="#E8EEF8"/>
