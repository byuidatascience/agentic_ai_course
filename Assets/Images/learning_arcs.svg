    <text x="391" y="594" font-size="26" font-weight="700" fill="#fff" text-anchor="middle">&lt;/&gt;</text>
    <rect x="262" y="577" width="58" height="50" rx="10" fill="#7C5CF0"/>
    <path d="M291,586 l5,11 l11,5 l-11,5 l-5,11 l-5,-11 l-11,-5 l11,-5 z" fill="#fff"/>
