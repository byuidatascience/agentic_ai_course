    <path d="M668,550 l9,-2 M684,548 l9,1" stroke="#1A2238" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M674,578 C680,576 686,577 688,579" fill="none" stroke="#9A4A2E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- hand on chin -->
