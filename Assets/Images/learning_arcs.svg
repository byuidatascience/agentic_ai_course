  <rect x="1086" y="733" width="375" height="70" rx="35" fill="#1E8A4C"/>
  <text x="1280" y="783" font-size="44" font-weight="800" fill="#fff" text-anchor="middle">Design</text>
  <g stroke="#fff" stroke-width="3" stroke-linecap="round">
    <line x1="1152" y1="760" x2="1168" y2="760"/><line x1="1156" y1="749" x2="1166" y2="755"/><line x1="1156" y1="771" x2="1166" y2="765"/>
    <line x1="1384" y1="760" x2="1400" y2="760"/><line x1="1386" y1="755" x2="1396" y2="749"/><line x1="1386" y1="765" x2="1396" y2="771"/>
  </g>

  <!-- ===== Bottom strip ===== -->
  <line x1="18" y1="850" x2="1130" y2="850" stroke="#E2E7EF" stroke-width="2"/>
  <text x="28" y="897" font-size="25" font-weight="700" fill="#0E1F4D">What changes</text>
  <text x="28" y="931" font-size="25" font-weight="700" fill="#0E1F4D">along the way?</text>

  <circle cx="290" cy="912" r="34" fill="#2F7CF0"/>
  <path d="M290,894 l6,12 l12,6 l-12,6 l-6,12 l-6,-12 l-12,-6 l12,-6 z" fill="#fff"/>
  <g font-size="17" fill="#2A3550">
    <text x="343" y="900">You start confident</text>
    <text x="343" y="924">and curious, building</text>
    <text x="343" y="948">your first agent.</text>
  </g>
  <line x1="512" y1="915" x2="536" y2="915" stroke="#9AA6B8" stroke-width="3" marker-end="url(#headGray)"/>

  <circle cx="593" cy="912" r="34" fill="#F5B416"/>
  <circle cx="589" cy="908" r="12" fill="none" stroke="#fff" stroke-width="5"/>
  <line x1="598" y1="917" x2="608" y2="927" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <g font-size="17" fill="#2A3550">
    <text x="643" y="900">You discover</text>
    <text x="643" y="924">what’s missing</text>
    <text x="643" y="948">(and what to fix).</text>
  </g>
  <line x1="792" y1="915" x2="816" y2="915" stroke="#9AA6B8" stroke-width="3" marker-end="url(#headGray)"/>

  <circle cx="882" cy="912" r="34" fill="#1E8A4C"/>
  <path d="M882,893 L898,899 L898,912 C898,922 890,929 882,932 C874,929 866,922 866,912 L866,899 Z" fill="none" stroke="#fff" stroke-width="3.5"/>
  <path d="M875,912 l5,5 l9,-10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-size="17" fill="#2A3550">
    <text x="934" y="895">You gain the skills</text>
    <text x="934" y="919">to architect and engineer</text>
    <text x="934" y="943">agents that are reliable,</text>
    <text x="934" y="967">safe, and valuable.</text>
  </g>

  <line x1="1153" y1="850" x2="1153" y2="992" stroke="#C5CEDB" stroke-width="2"/>
  <g fill="none" stroke="#163A8C" stroke-width="3">
    <circle cx="1198" cy="860" r="15"/><circle cx="1198" cy="860" r="8"/>
