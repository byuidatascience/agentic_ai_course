project : 
  type : website
  output-dir :  docs
  # Only course material is rendered or copied into docs/. Internal work
  # products (design docs, scratch notes, drafts, repo README/TODO) stay unpublished.
  render : 
    - "*"
    - "!scratch/**"
    - "!temp/**"
    - "!course_design/**"
    - "!TODO.md"
    - "!README.md"
    - "!drafts/**"
    - "!templates/**"
  resources : 
    - "!drafts/**"
    - "!templates/**"
    - "!scratch/**"
    - "!temp/**"
    - "!course_design/**"
    - "!TODO.md"
    - "!README.md"

execute:
  eval: false

website : 
  favicon :  Assets/Images/byui_logo.png
  navbar : 
    background :  primary
    logo :  Assets/Images/byui_logo.png
    left : 
      - text :  "Home"
        href :  index.html

      - text :  "Unit 1"
        menu : 
          # - text :  "Unit 1 Overview"
          #   href :  lessons/unit1.html
          # - text :  "---"
          - text :  "Day 1 : APIs & Your First LLM Call"
            href :  lessons/lesson1_1.html
          # - text :  "Day 2 : Tools - Structure & Uses"
          #   href :  lessons/lesson1_2.html
          # - text :  "Day 3 : Tool Wrappers & Local Data"
          #   href :  lessons/lesson1_3.html

  page-footer :
    left :  "Agentic AI Course — BYU-Idaho"
    right :  "Built with [Quarto](https://quarto.org)"

format : 
  html : 
    # A light/dark pair makes Quarto render both stylesheets and add the
    # toggle to the navbar. Keep highlight-style paired to match, or the
    # code-block colours end up tuned for the wrong background.
    theme :
      light :  cosmo
      dark :  darkly
    css :  styles.css
    toc : true
    toc-depth : 2
    toc-location : left
    toc-title : "On this page"
    code-copy : true
    code-fold : false
    highlight-style :
      light :  github
      dark :  github-dark
    smooth-scroll : true